{% if salas %}
<div class="table-responsive">
  <table class="table table-hover align-middle mb-0" id="tabla-salas">
    <thead class="table-light">
      <tr>
        <th scope="col">Código</th>
        <th scope="col">Nombre</th>
        <th scope="col">Capacidad</th>
        <th scope="col" class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for sala in salas %}
      <tr>
        <td><strong>{{ sala.codigo }}</strong></td>
        <td>{{ sala.nombre }}</td>
        <td>{{ sala.capacidad }} puestos</td>
        <td class="text-end">
          <button
            type="button"
            class="btn btn-sm btn-outline-primary me-1"
            hx-get="{% url 'salas:editar-sala' sala.id_sala %}"
            hx-target="#modal-body"
            hx-on::after-request="window.dispatchEvent(new CustomEvent('abrir-modal', {detail: {title: 'Editar sala'}}))" title="Editar"
          >
            <i class="bi bi-pencil"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            onclick="window.dispatchEvent(new CustomEvent('confirmar-eliminar', {detail: {url: '{% url 'salas:eliminar-sala' sala.id_sala %}', message: '¿Estás seguro de eliminar la sala {{ sala.nombre|escapejs }}?'}}))"
            title="Eliminar"
          >
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4" class="text-center text-muted py-4">
          <i class="bi bi-building fs-4 d-block mb-2"></i>
          No hay salas registradas. Crea la primera.
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="text-center text-muted py-5">
  <i class="bi bi-building fs-1 d-block mb-3"></i>
  <p class="mb-0">No hay salas registradas.</p>
  <button
    type="button"
    class="btn btn-primary mt-3"
    hx-get="{% url 'salas:crear-sala' %}"
    hx-target="#modal-body"
    hx-on::after-request="window.dispatchEvent(new CustomEvent('abrir-modal', {detail: {title: 'Nueva sala'}}))"
  >
    <i class="bi bi-plus-lg"></i> Crear primera sala
  </button>
</div>
{% endif %}
