{% extends "base.html" %}

{% block title %}Semestres — SGM SC{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">
      <i class="bi bi-calendar3 me-2"></i>Semestres
    </h1>
    <button
      type="button"
      class="btn btn-primary"
      hx-get="{% url 'semestres:crear' %}"
      hx-target="#modal-body"
      hx-on::after-request="window.dispatchEvent(new CustomEvent('abrir-modal', {detail: {title: 'Nuevo semestre'}}))"
    >
      <i class="bi bi-plus-lg"></i> Nuevo semestre
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0" id="grid-container">
      {% include "partials/_tabla_semestres.html" %}
    </div>
  </div>

  {% include "components/modal.html" %}
</div>
{% endblock %}
